name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check ./plugin/lib/index.js
          node --check ./plugin/lib/client.js
          node --check ./plugin/lib/resilience.js
          node --check ./gateway/server.mjs

      - name: Run unit tests
        shell: pwsh
        run: npm test

      - name: Compile Python synchronizer
        shell: pwsh
        run: python -m py_compile ./scripts/sync-dsh-models.py

      - name: Parse installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { throw ($errors | Out-String) }
          foreach ($script in @('./launcher/Start-DSHWeb.ps1', './launcher/Install-DSHWebShortcut.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }

      - name: Test isolated installation
        shell: pwsh
        run: |
          $testHome = Join-Path $PWD 'work/test-dsh-home'
          ./install.ps1 -DshHome $testHome -SkipConversationHistory
          $installed = Join-Path $testHome '.agent-presets/ocui/plugin/lib/index.js'
          if (-not (Test-Path -LiteralPath $installed)) {
            throw 'Plugin installation test failed.'
          }
